name: Update Subscriptions

on:
  workflow_dispatch:  # 仅保留手动触发按钮
  
concurrency:
  group: update-subscriptions-main
  cancel-in-progress: false
  
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        env:
          TARGET_BRANCH: main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A output/ README.md

          if git diff --cached --quiet; then
            echo "没有节点变动与内容更新。"
            exit 0
          fi

          git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

          # 最多尝试同步并推送 3 次；绝不强制覆盖远程提交
          for attempt in 1 2 3; do
            echo "推送尝试 ${attempt}/3"

            git fetch origin "${TARGET_BRANCH}"

            if ! git rebase "origin/${TARGET_BRANCH}"; then
              echo "::error::Rebase 失败，可能存在文件冲突。保留远程提交，不自动覆盖。"
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "推送成功。"
              exit 0
            fi

            echo "推送失败，检查远程是否再次更新。"
            sleep 2
          done

          echo "::error::连续 3 次推送失败，请检查远程提交和日志。"
          exit 1

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json residential.txt residential-clash.yaml residential-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"
